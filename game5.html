<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Fighter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
            background: #222;
        }

        /* Responsive Canvas Scaling */
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
        }

        .health-bar-container {
            position: relative;
            width: 40%;
            height: 30px;
            background-color: #eb0000;
            border: 2px solid white;
        }

        #player1-health {
            background-color: #3b82f6;
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            transform-origin: left;
        }

        #player2-health {
            background-color: #ef4444;
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            transform-origin: right;
            float: right;
        }

        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: #333;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fbbf24;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 4px 4px 0px #000;
            display: none;
            z-index: 20;
            width: 100%;
        }

        #rematch-btn {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #fbbf24;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 20;
            transition: transform 0.2s;
            pointer-events: auto;
        }

        #rematch-btn:hover { transform: scale(1.05); }

        /* --- Character Select Screen Styles --- */
        #character-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 17, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .select-container {
            display: flex;
            gap: 50px;
            margin: 20px 0;
        }

        .player-select {
            background: #222;
            padding: 20px;
            border: 2px solid #444;
            border-radius: 10px;
            text-align: center;
            width: 380px; 
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            max-height: 320px; 
            overflow-y: auto; 
            padding-right: 5px;
        }

        .options-grid::-webkit-scrollbar { width: 8px; }
        .options-grid::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
        .options-grid::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .options-grid::-webkit-scrollbar-thumb:hover { background: #777; }

        .char-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 0; 
            border: 2px solid transparent;
            background: #333;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            border-radius: 5px;
        }
        
        .char-btn:hover { background: #555; }
        .p1-active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .p2-active { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .stat-text {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
            margin-top: 5px;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #fbbf24;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        #start-btn:hover { transform: scale(1.05); }
        #start-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        .controls-info {
            margin-top: 20px;
            display: flex;
            gap: 40px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px 30px;
            border-radius: 10px;
        }

        .controls-info h3 { margin-bottom: 10px; color: #fbbf24; }
        .p1-color { color: #3b82f6; }
        .p2-color { color: #ef4444; }

    </style>
</head>
<body>

    <!-- --- Character Select Screen --- -->
    <div id="character-select">
        <h1 style="color: #fbbf24; margin-bottom: 20px; font-size: 3rem;">SELECT FIGHTER</h1>
        <div class="select-container">
            <div class="player-select">
                <h2 class="p1-color" style="margin-bottom: 10px;">Player 1</h2>
                <div id="p1-options" class="options-grid"></div>
            </div>
            <div class="player-select">
                <h2 class="p2-color" style="margin-bottom: 10px;">Player 2</h2>
                <div id="p2-options" class="options-grid"></div>
            </div>
        </div>
        <button id="start-btn" onclick="startGame()" disabled>Select Characters</button>
    </div>

    <div id="game-wrapper">
        <div id="ui-layer">
            <!-- P1 Health -->
            <div class="health-bar-container" style="float: left;">
                <div id="player1-health"></div>
            </div>
            
            <!-- Timer -->
            <div id="timer">60</div>

            <!-- P2 Health -->
            <div class="health-bar-container" style="float: right;">
                <div id="player2-health"></div>
            </div>

            <!-- Game Over / Win Text -->
            <div id="result">Player 1 Wins!</div>
            <button id="rematch-btn" onclick="rematch()">CHARACTER SELECT</button>
        </div>
        <canvas></canvas>
    </div>

    <div class="controls-info">
        <div>
            <h3 class="p1-color">Player 1 (Blue)</h3>
            <p>Move: <b>A / D</b></p>
            <p>Jump: <b>W</b></p>
            <p>Punch: <b>Space</b></p>
        </div>
        <div>
            <h3 class="p2-color">Player 2 (Red)</h3>
            <p>Move: <b>Left / Right Arrows</b></p>
            <p>Jump: <b>Up Arrow</b></p>
            <p>Punch: <b>Enter / Numpad 0</b></p>
        </div>
    </div>

    <script>
        const canvas = document.querySelector('canvas');
        const c = canvas.getContext('2d');

        // Internal resolution
        canvas.width = 1024;
        canvas.height = 576;

        const gravity = 0.7;
        const groundHeight = 50;

        // --- Character Data (Updated for articulated figures) ---
        const characters = {
            ryu: { id: 'ryu', name: 'Ryu', bodyColor: '#eeeeee', shirtColor: '#eeeeee', pantsColor: '#eeeeee', skinColor: '#fcdeb3', detailColor: '#ef4444', hp: 100, atk: 10, speed: 6 },
            ken: { id: 'ken', name: 'Ken', bodyColor: '#ef4444', shirtColor: '#ef4444', pantsColor: '#ef4444', skinColor: '#fcdeb3', detailColor: '#fbbf24', hp: 100, atk: 10, speed: 6 },
            zangief: { id: 'zangief', name: 'Zangief', bodyColor: '#ef4444', shirtColor: '#f5bca9', pantsColor: '#ef4444', skinColor: '#f5bca9', detailColor: '#4a3000', hp: 150, atk: 15, speed: 4 },
            chunli: { id: 'chunli', name: 'Chun Li', bodyColor: '#3b82f6', shirtColor: '#3b82f6', pantsColor: '#78350f', skinColor: '#fcdeb3', detailColor: '#ffffff', hp: 80, atk: 8, speed: 9 },
            blanka: { id: 'blanka', name: 'Blanka', bodyColor: '#22c55e', shirtColor: '#22c55e', pantsColor: '#f97316', skinColor: '#22c55e', detailColor: '#f97316', hp: 110, atk: 12, speed: 7 },
            cammy: { id: 'cammy', name: 'Cammy', bodyColor: '#15803d', shirtColor: '#15803d', pantsColor: '#fcdeb3', skinColor: '#fcdeb3', detailColor: '#ef4444', hp: 70, atk: 9, speed: 10 },
            guile: { id: 'guile', name: 'Guile', bodyColor: '#15803d', shirtColor: '#15803d', pantsColor: '#064e3b', skinColor: '#fcdeb3', detailColor: '#facc15', hp: 110, atk: 9, speed: 5 },
            dhalsim: { id: 'dhalsim', name: 'Dhalsim', bodyColor: '#facc15', shirtColor: '#8b5a2b', pantsColor: '#facc15', skinColor: '#8b5a2b', detailColor: '#ef4444', hp: 75, atk: 11, speed: 4 },
            ehonda: { id: 'ehonda', name: 'E. Honda', bodyColor: '#3b82f6', shirtColor: '#fcdeb3', pantsColor: '#3b82f6', skinColor: '#fcdeb3', detailColor: '#111827', hp: 140, atk: 14, speed: 3 },
            balrog: { id: 'balrog', name: 'Balrog', bodyColor: '#2563eb', shirtColor: '#2563eb', pantsColor: '#2563eb', skinColor: '#5c3a21', detailColor: '#ef4444', hp: 120, atk: 13, speed: 7 },
            vega: { id: 'vega', name: 'Vega', bodyColor: '#a855f7', shirtColor: '#fcdeb3', pantsColor: '#a855f7', skinColor: '#fcdeb3', detailColor: '#78350f', hp: 75, atk: 10, speed: 9 },
            sagat: { id: 'sagat', name: 'Sagat', bodyColor: '#1d4ed8', shirtColor: '#d4a373', pantsColor: '#1d4ed8', skinColor: '#d4a373', detailColor: '#111827', hp: 130, atk: 14, speed: 5 },
            mbison: { id: 'mbison', name: 'M. Bison', bodyColor: '#ef4444', shirtColor: '#ef4444', pantsColor: '#ef4444', skinColor: '#fcdeb3', detailColor: '#111827', hp: 125, atk: 13, speed: 6 },
            juri: { id: 'juri', name: 'Juri', bodyColor: '#c026d3', shirtColor: '#c026d3', pantsColor: '#c026d3', skinColor: '#fcdeb3', detailColor: '#111827', hp: 85, atk: 11, speed: 8 },
            deejay: { id: 'deejay', name: 'Dee Jay', bodyColor: '#ea580c', shirtColor: '#5c3a21', pantsColor: '#ea580c', skinColor: '#5c3a21', detailColor: '#10b981', hp: 105, atk: 10, speed: 7 },
            luke: { id: 'luke', name: 'Luke', bodyColor: '#3b82f6', shirtColor: '#3b82f6', pantsColor: '#3b82f6', skinColor: '#fcdeb3', detailColor: '#facc15', hp: 100, atk: 11, speed: 6 }
        };

        let p1Choice = null;
        let p2Choice = null;
        let player;
        let enemy;
        let gameStarted = false;

        // --- Classes ---

        class Fighter {
            constructor({ position, velocity, stats, facingRight = true }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 150;
                
                this.stats = stats;
                this.maxHealth = stats.hp;
                this.health = stats.hp;
                this.attackPower = stats.atk;
                this.speed = stats.speed;

                this.lastKey = '';
                this.facingRight = facingRight;
                
                this.hitStun = 0;
                this.knockbackVelocity = 0;
                this.frames = 0; // Used for idle animation bob
                
                this.attackBox = {
                    position: { x: this.position.x, y: this.position.y },
                    width: 65, 
                    height: 20 
                };
                
                this.isAttacking = false;
                this.dead = false;
                this.colorFlash = null;
            }

            draw() {
                // If hit, flash as a solid white block
                if (this.colorFlash) {
                    c.fillStyle = this.colorFlash;
                    c.fillRect(this.position.x, this.position.y, this.width, this.height);
                    return;
                }

                // Breathing animation offset (only active when standing still)
                let bobY = 0;
                if (this.velocity.x === 0 && this.velocity.y === 0 && !this.isAttacking && this.hitStun === 0) {
                    bobY = Math.sin(this.frames * 0.15) * 2;
                }

                const headR = 16;
                const headX = this.position.x + this.width / 2;
                const headY = this.position.y + headR + 10 + bobY;

                // 1. Shadow / Ground Contact
                c.fillStyle = 'rgba(0, 0, 0, 0.3)';
                c.beginPath();
                c.ellipse(this.position.x + this.width / 2, this.position.y + this.height, 25, 5, 0, 0, Math.PI * 2);
                c.fill();

                // 2. Legs (Pants)
                c.fillStyle = this.stats.pantsColor;
                const backLegX = this.position.x + (this.facingRight ? 12 : 23);
                const frontLegX = this.position.x + (this.facingRight ? 23 : 12);
                
                const legY = this.position.y + 90;
                c.fillRect(backLegX, legY, 15, 55);
                c.fillRect(frontLegX, legY, 15, 55);

                // 3. Shoes
                c.fillStyle = '#111'; // Generic dark shoes
                c.fillRect(backLegX - (this.facingRight ? 5 : 0), legY + 50, 20, 10);
                c.fillRect(frontLegX - (this.facingRight ? 5 : 0), legY + 50, 20, 10);

                // 4. Torso (Shirt/Chest)
                c.fillStyle = this.stats.shirtColor;
                c.fillRect(this.position.x + 10, this.position.y + 40 + bobY, 30, 50);

                // 5. Head
                c.fillStyle = this.stats.skinColor;
                c.beginPath();
                c.arc(headX, headY, headR, 0, Math.PI * 2);
                c.fill();

                // 6. Head Detail (Hair/Headband)
                c.fillStyle = this.stats.detailColor;
                c.beginPath();
                c.arc(headX, headY - 4, headR + 1, Math.PI, 0); 
                c.fill();
                // Add headband tail
                if(this.facingRight) {
                    c.fillRect(headX - headR - 5, headY - 6, headR * 2 + 5, 5);
                } else {
                    c.fillRect(headX - headR, headY - 6, headR * 2 + 5, 5);
                }

                // 7. Eye
                c.fillStyle = '#000';
                const eyeOffsetX = this.facingRight ? 6 : -9;
                c.fillRect(headX + eyeOffsetX, headY - 4, 4, 4);

                // 8. Arms and Gloves
                if (this.isAttacking) {
                    // Attacking Arm
                    const punchW = this.attackBox.width;
                    const punchH = 14;
                    const armX = this.facingRight ? this.position.x + 25 : this.position.x + this.width - 25 - punchW;
                    
                    // Arm
                    c.fillStyle = this.stats.skinColor;
                    c.fillRect(armX, this.position.y + 45 + bobY, punchW, punchH);
                    
                    // Fist/Glove
                    c.fillStyle = this.stats.detailColor;
                    const fistX = this.facingRight ? armX + punchW - 15 : armX;
                    c.fillRect(fistX, this.position.y + 42 + bobY, 15, 20);
                } else {
                    // Idle Arms (Bent defensively)
                    c.fillStyle = this.stats.skinColor;
                    c.fillRect(this.position.x + 15, this.position.y + 45 + bobY, 20, 12); // Upper arm
                    
                    const forearmX = this.position.x + (this.facingRight ? 25 : 13);
                    c.fillRect(forearmX, this.position.y + 35 + bobY, 12, 22); // Forearm
                    
                    // Glove
                    c.fillStyle = this.stats.detailColor;
                    c.fillRect(forearmX - 2, this.position.y + 33 + bobY, 16, 12);
                }
            }

            update() {
                this.frames++;
                this.draw();
                
                if (this.dead) return;

                // Update attack box position to follow player's new arm height
                if (this.facingRight) {
                    this.attackBox.position.x = this.position.x + this.width;
                    this.attackBox.position.y = this.position.y + 45; 
                } else {
                    this.attackBox.position.x = this.position.x - this.attackBox.width;
                    this.attackBox.position.y = this.position.y + 45;
                }

                // Movement physics
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Screen boundaries (walls)
                if (this.position.x <= 0) {
                    this.position.x = 0;
                } else if (this.position.x + this.width >= canvas.width) {
                    this.position.x = canvas.width - this.width;
                }

                // Gravity & Floor collision
                if (this.position.y + this.height + this.velocity.y >= canvas.height - groundHeight) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - groundHeight - this.height; // Snap to floor
                } else {
                    this.velocity.y += gravity; // Falling
                }
            }

            attack() {
                if (this.hitStun > 0) return; 
                this.isAttacking = true;
                setTimeout(() => {
                    this.isAttacking = false;
                }, 150);
            }
            
            takeDamage(amount, directionMultiplier) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    this.dead = true;
                }
                
                this.hitStun = 20;
                this.knockbackVelocity = 6 * directionMultiplier;
                this.velocity.y = -8;
                
                this.colorFlash = 'white';
                setTimeout(() => {
                    this.colorFlash = null;
                }, 100);
            }
        }

        // --- Setup ---

        const keys = {
            a: { pressed: false },
            d: { pressed: false },
            w: { pressed: false },
            ArrowRight: { pressed: false },
            ArrowLeft: { pressed: false },
            ArrowUp: { pressed: false }
        };

        // --- UI & Selection Logic ---

        function createSelectScreen() {
            const p1Container = document.getElementById('p1-options');
            const p2Container = document.getElementById('p2-options');

            Object.values(characters).forEach(char => {
                const btn1 = document.createElement('button');
                btn1.className = 'char-btn';
                btn1.innerHTML = `<span style="color:${char.bodyColor}; font-size:1.2rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">${char.name}</span><span class="stat-text">HP: ${char.hp} | ATK: ${char.atk} | SPD: ${char.speed}</span>`;
                btn1.onclick = () => selectChar(1, char, btn1);
                p1Container.appendChild(btn1);

                const btn2 = document.createElement('button');
                btn2.className = 'char-btn';
                btn2.innerHTML = `<span style="color:${char.bodyColor}; font-size:1.2rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">${char.name}</span><span class="stat-text">HP: ${char.hp} | ATK: ${char.atk} | SPD: ${char.speed}</span>`;
                btn2.onclick = () => selectChar(2, char, btn2);
                p2Container.appendChild(btn2);
            });
        }

        function selectChar(playerNum, char, btnElement) {
            if (playerNum === 1) {
                p1Choice = char;
                document.querySelectorAll('#p1-options .char-btn').forEach(b => b.classList.remove('p1-active'));
                btnElement.classList.add('p1-active');
            } else {
                p2Choice = char;
                document.querySelectorAll('#p2-options .char-btn').forEach(b => b.classList.remove('p2-active'));
                btnElement.classList.add('p2-active');
            }

            if (p1Choice && p2Choice) {
                const startBtn = document.getElementById('start-btn');
                startBtn.disabled = false;
                startBtn.innerText = "START FIGHT!";
            }
        }

        function startGame() {
            document.getElementById('character-select').style.display = 'none';
            gameStarted = true;

            player = new Fighter({
                position: { x: 200, y: 0 },
                velocity: { x: 0, y: 0 },
                stats: p1Choice,
                facingRight: true
            });

            enemy = new Fighter({
                position: { x: 774, y: 0 },
                velocity: { x: 0, y: 0 },
                stats: p2Choice,
                facingRight: false
            });

            document.querySelector('#player1-health').style.width = '100%';
            document.querySelector('#player2-health').style.width = '100%';
            document.querySelector('#player1-health').style.backgroundColor = p1Choice.bodyColor;
            document.querySelector('#player2-health').style.backgroundColor = p2Choice.bodyColor;
            
            resultUI.style.display = 'none';
            timer = 60;
            decreaseTimer();
            animate();
        }

        createSelectScreen();

        // --- Timer and Win Logic ---

        let timer = 60;
        let timerId;
        const resultUI = document.querySelector('#result');
        const rematchBtn = document.querySelector('#rematch-btn');

        function determineWinner() {
            clearTimeout(timerId);
            resultUI.style.display = 'block';
            rematchBtn.style.display = 'block';
            
            const p1Percent = player.health / player.maxHealth;
            const p2Percent = enemy.health / enemy.maxHealth;
            
            if (p1Percent === p2Percent) {
                resultUI.innerHTML = 'TIE';
                resultUI.style.color = 'white';
            } else if (p1Percent > p2Percent) {
                resultUI.innerHTML = 'PLAYER 1 WINS';
                resultUI.style.color = p1Choice.bodyColor;
            } else {
                resultUI.innerHTML = 'PLAYER 2 WINS';
                resultUI.style.color = p2Choice.bodyColor;
            }
        }

        function decreaseTimer() {
            if (timer > 0 && gameStarted) {
                timerId = setTimeout(decreaseTimer, 1000);
                timer--;
                document.querySelector('#timer').innerHTML = timer;
            }

            if (timer === 0) {
                determineWinner();
            }
        }

        function rematch() {
            resultUI.style.display = 'none';
            rematchBtn.style.display = 'none';
            document.getElementById('character-select').style.display = 'flex';
            gameStarted = false;
            p1Choice = null;
            p2Choice = null;
            
            document.querySelectorAll('.char-btn').forEach(b => {
                b.classList.remove('p1-active');
                b.classList.remove('p2-active');
            });

            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = true;
            startBtn.innerText = "Select Characters";

            clearTimeout(timerId);
            timer = 60;
            document.querySelector('#timer').innerHTML = timer;
        }

        // --- Collision Detection ---

        function rectangularCollision({ rect1, rect2 }) {
            return (
                rect1.attackBox.position.x + rect1.attackBox.width >= rect2.position.x &&
                rect1.attackBox.position.x <= rect2.position.x + rect2.width &&
                rect1.attackBox.position.y + rect1.attackBox.height >= rect2.position.y &&
                rect1.attackBox.position.y <= rect2.position.y + rect2.height
            );
        }

        // --- Game Loop ---

        function animate() {
            if (!gameStarted) return;
            window.requestAnimationFrame(animate);

            c.fillStyle = '#222'; 
            c.fillRect(0, 0, canvas.width, canvas.height);
            
            c.fillStyle = '#444';
            c.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            c.strokeStyle = '#333';
            c.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=50) {
                c.beginPath(); c.moveTo(i, 0); c.lineTo(i, canvas.height); c.stroke();
            }
            for(let i=0; i<canvas.height; i+=50) {
                c.beginPath(); c.moveTo(0, i); c.lineTo(canvas.width, i); c.stroke();
            }

            player.update();
            enemy.update();

            if (player.dead || enemy.dead || timer === 0) {
                if(!resultUI.style.display || resultUI.style.display === 'none') {
                    determineWinner();
                }
                return;
            }

            if (player.hitStun > 0) {
                player.velocity.x = player.knockbackVelocity; 
                player.hitStun--;
            } else {
                player.velocity.x = 0; 
                if (keys.a.pressed && player.lastKey === 'a') {
                    player.velocity.x = -player.speed;
                    player.facingRight = false;
                } else if (keys.d.pressed && player.lastKey === 'd') {
                    player.velocity.x = player.speed;
                    player.facingRight = true;
                }
            }

            if (enemy.hitStun > 0) {
                enemy.velocity.x = enemy.knockbackVelocity; 
                enemy.hitStun--;
            } else {
                enemy.velocity.x = 0; 
                if (keys.ArrowLeft.pressed && enemy.lastKey === 'ArrowLeft') {
                    enemy.velocity.x = -enemy.speed;
                    enemy.facingRight = false;
                } else if (keys.ArrowRight.pressed && enemy.lastKey === 'ArrowRight') {
                    enemy.velocity.x = enemy.speed;
                    enemy.facingRight = true;
                }
            }

            if (player.velocity.x === 0 && enemy.velocity.x === 0 && player.hitStun === 0 && enemy.hitStun === 0) {
                 player.facingRight = player.position.x < enemy.position.x;
                 enemy.facingRight = enemy.position.x < player.position.x;
            }

            if (
                rectangularCollision({ rect1: player, rect2: enemy }) &&
                player.isAttacking &&
                !enemy.dead &&
                enemy.hitStun === 0 
            ) {
                player.isAttacking = false; 
                let direction = player.position.x < enemy.position.x ? 1 : -1; 
                enemy.takeDamage(player.attackPower, direction);
                document.querySelector('#player2-health').style.width = Math.max(0, (enemy.health / enemy.maxHealth) * 100) + '%';
            }

            if (
                rectangularCollision({ rect1: enemy, rect2: player }) &&
                enemy.isAttacking &&
                !player.dead &&
                player.hitStun === 0
            ) {
                enemy.isAttacking = false;
                let direction = enemy.position.x < player.position.x ? 1 : -1;
                player.takeDamage(enemy.attackPower, direction);
                document.querySelector('#player1-health').style.width = Math.max(0, (player.health / player.maxHealth) * 100) + '%';
            }
        }

        // --- Event Listeners ---

        window.addEventListener('keydown', (event) => {
            if (!gameStarted || player.dead || enemy.dead || timer === 0) return;

            switch (event.key) {
                case 'd':
                    keys.d.pressed = true;
                    player.lastKey = 'd';
                    break;
                case 'a':
                    keys.a.pressed = true;
                    player.lastKey = 'a';
                    break;
                case 'w':
                    if (player.velocity.y === 0 && player.hitStun === 0) player.velocity.y = -16; 
                    break;
                case ' ':
                    player.attack();
                    break;

                case 'ArrowRight':
                    keys.ArrowRight.pressed = true;
                    enemy.lastKey = 'ArrowRight';
                    break;
                case 'ArrowLeft':
                    keys.ArrowLeft.pressed = true;
                    enemy.lastKey = 'ArrowLeft';
                    break;
                case 'ArrowUp':
                    if (enemy.velocity.y === 0 && enemy.hitStun === 0) enemy.velocity.y = -16;
                    break;
                case 'Enter':
                case '0':
                    enemy.attack();
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'd': keys.d.pressed = false; break;
                case 'a': keys.a.pressed = false; break;
                case 'ArrowRight': keys.ArrowRight.pressed = false; break;
                case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
            }
        });
    </script>
</body>
</html>
