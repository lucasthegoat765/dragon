<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Fighter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
            background: #222;
        }

        /* Responsive Canvas Scaling */
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
        }

        .health-bar-container {
            position: relative;
            width: 40%;
            height: 30px;
            background-color: #eb0000;
            border: 2px solid white;
        }

        #player1-health {
            background-color: #3b82f6;
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            transform-origin: left;
        }

        #player2-health {
            background-color: #ef4444;
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            transform-origin: right;
            float: right;
        }

        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: #333;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fbbf24;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 4px 4px 0px #000;
            display: none;
            z-index: 20;
            width: 100%;
        }

        /* --- Character Select Screen Styles --- */
        #character-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 17, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .select-container {
            display: flex;
            gap: 50px;
            margin: 20px 0;
        }

        .player-select {
            background: #222;
            padding: 20px;
            border: 2px solid #444;
            border-radius: 10px;
            text-align: center;
            width: 250px;
        }

        .char-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid transparent;
            background: #333;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            border-radius: 5px;
        }
        
        .char-btn:hover { background: #555; }
        .p1-active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .p2-active { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .stat-text {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
            margin-top: 5px;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #fbbf24;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        #start-btn:hover { transform: scale(1.05); }
        #start-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        .controls-info {
            margin-top: 20px;
            display: flex;
            gap: 40px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px 30px;
            border-radius: 10px;
        }

        .controls-info h3 {
            margin-bottom: 10px;
            color: #fbbf24;
        }
        
        .p1-color { color: #3b82f6; }
        .p2-color { color: #ef4444; }

    </style>
</head>
<body>

    <!-- --- Character Select Screen --- -->
    <div id="character-select">
        <h1 style="color: #fbbf24; margin-bottom: 20px; font-size: 3rem;">SELECT FIGHTER</h1>
        <div class="select-container">
            <div class="player-select">
                <h2 class="p1-color" style="margin-bottom: 10px;">Player 1</h2>
                <div id="p1-options"></div>
            </div>
            <div class="player-select">
                <h2 class="p2-color" style="margin-bottom: 10px;">Player 2</h2>
                <div id="p2-options"></div>
            </div>
        </div>
        <button id="start-btn" onclick="startGame()" disabled>Select Characters</button>
    </div>

    <div id="game-wrapper">
        <div id="ui-layer">
            <!-- P1 Health -->
            <div class="health-bar-container" style="float: left;">
                <div id="player1-health"></div>
            </div>
            
            <!-- Timer -->
            <div id="timer">60</div>

            <!-- P2 Health -->
            <div class="health-bar-container" style="float: right;">
                <div id="player2-health"></div>
            </div>

            <!-- Game Over / Win Text -->
            <div id="result">Player 1 Wins!</div>
        </div>
        <canvas></canvas>
    </div>

    <div class="controls-info">
        <div>
            <h3 class="p1-color">Player 1 (Blue)</h3>
            <p>Move: <b>A / D</b></p>
            <p>Jump: <b>W</b></p>
            <p>Punch: <b>Space</b></p>
        </div>
        <div>
            <h3 class="p2-color">Player 2 (Red)</h3>
            <p>Move: <b>Left / Right Arrows</b></p>
            <p>Jump: <b>Up Arrow</b></p>
            <p>Punch: <b>Enter / Numpad 0</b></p>
        </div>
    </div>

    <script>
        const canvas = document.querySelector('canvas');
        const c = canvas.getContext('2d');

        // Internal resolution (Classic 16:9 2D Fighter ratio)
        canvas.width = 1024;
        canvas.height = 576;

        const gravity = 0.7;
        const groundHeight = 50;

        // --- Character Data ---
        const characters = {
            balanced: { id: 'balanced', name: 'Balanced', color: '#3b82f6', hp: 100, atk: 10, speed: 6 },
            heavy: { id: 'heavy', name: 'Heavy (Bruiser)', color: '#ef4444', hp: 150, atk: 15, speed: 4 },
            speedster: { id: 'speedster', name: 'Speedster', color: '#10b981', hp: 70, atk: 8, speed: 9 },
            striker: { id: 'striker', name: 'Striker', color: '#8b5cf6', hp: 60, atk: 25, speed: 7 }
        };

        let p1Choice = null;
        let p2Choice = null;
        let player;
        let enemy;
        let gameStarted = false;

        // --- Classes ---

        class Fighter {
            constructor({ position, velocity, stats, facingRight = true }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 150;
                
                // Assign stats based on selection
                this.color = stats.color;
                this.maxHealth = stats.hp;
                this.health = stats.hp;
                this.attackPower = stats.atk;
                this.speed = stats.speed;

                this.lastKey = '';
                this.facingRight = facingRight;
                
                // Hit stun and knockback properties
                this.hitStun = 0;
                this.knockbackVelocity = 0;
                
                this.attackBox = {
                    position: {
                        x: this.position.x,
                        y: this.position.y
                    },
                    width: 70, // Reach of the punch
                    height: 25 // Thickness of the punch
                };
                
                this.isAttacking = false;
                this.health = 100;
                this.dead = false;
                this.colorFlash = null;
            }

            draw() {
                // Flash white when taking damage
                if (this.colorFlash) {
                    c.fillStyle = this.colorFlash;
                } else {
                    c.fillStyle = this.color;
                }
                
                // Draw character body
                c.fillRect(this.position.x, this.position.y, this.width, this.height);

                // Draw "Eye" / Visor to show which way they are looking
                c.fillStyle = 'rgba(255, 255, 255, 0.8)';
                if (this.facingRight) {
                    c.fillRect(this.position.x + 30, this.position.y + 10, 15, 10);
                } else {
                    c.fillRect(this.position.x + 5, this.position.y + 10, 15, 10);
                }

                // Draw extending "arm" when attacking
                if (this.isAttacking) {
                    c.fillStyle = this.color; // Arm matches body color
                    if (this.facingRight) {
                        c.fillRect(
                            this.position.x + this.width, 
                            this.position.y + 25, 
                            this.attackBox.width, 
                            this.attackBox.height
                        );
                    } else {
                        c.fillRect(
                            this.position.x - this.attackBox.width, 
                            this.position.y + 25, 
                            this.attackBox.width, 
                            this.attackBox.height
                        );
                    }
                }
            }

            update() {
                this.draw();
                
                if (this.dead) return;

                // Update attack box position to follow player and direction
                if (this.facingRight) {
                    this.attackBox.position.x = this.position.x + this.width;
                    this.attackBox.position.y = this.position.y + 25; 
                } else {
                    this.attackBox.position.x = this.position.x - this.attackBox.width;
                    this.attackBox.position.y = this.position.y + 25;
                }

                // Movement physics
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Screen boundaries (walls)
                if (this.position.x <= 0) {
                    this.position.x = 0;
                } else if (this.position.x + this.width >= canvas.width) {
                    this.position.x = canvas.width - this.width;
                }

                // Gravity & Floor collision
                if (this.position.y + this.height + this.velocity.y >= canvas.height - groundHeight) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - groundHeight - this.height; // Snap to floor
                } else {
                    this.velocity.y += gravity; // Falling
                }
            }

            attack() {
                // Prevent attacking if currently stunned from being hit
                if (this.hitStun > 0) return; 
                
                this.isAttacking = true;
                setTimeout(() => {
                    this.isAttacking = false;
                }, 150); // Attack stays out for 150ms
            }
            
            takeDamage(amount, directionMultiplier) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    this.dead = true;
                }
                
                // Apply knockback and hit stun
                this.hitStun = 20; // 20 frames of being unable to move
                this.knockbackVelocity = 6 * directionMultiplier; // Push back speed
                this.velocity.y = -8; // Small pop-up into the air
                
                // Visual flash effect
                this.colorFlash = 'white';
                setTimeout(() => {
                    this.colorFlash = null;
                }, 100);
            }
        }

        // --- Game Setup ---

        const keys = {
            a: { pressed: false },
            d: { pressed: false },
            w: { pressed: false },
            ArrowRight: { pressed: false },
            ArrowLeft: { pressed: false },
            ArrowUp: { pressed: false }
        };

        // --- UI & Selection Logic ---

        function createSelectScreen() {
            const p1Container = document.getElementById('p1-options');
            const p2Container = document.getElementById('p2-options');

            Object.values(characters).forEach(char => {
                // P1 Button
                const btn1 = document.createElement('button');
                btn1.className = 'char-btn';
                btn1.innerHTML = `<span style="color:${char.color}; font-size:1.2rem;">${char.name}</span><span class="stat-text">HP: ${char.hp} | ATK: ${char.atk} | SPD: ${char.speed}</span>`;
                btn1.onclick = () => selectChar(1, char, btn1);
                p1Container.appendChild(btn1);

                // P2 Button
                const btn2 = document.createElement('button');
                btn2.className = 'char-btn';
                btn2.innerHTML = `<span style="color:${char.color}; font-size:1.2rem;">${char.name}</span><span class="stat-text">HP: ${char.hp} | ATK: ${char.atk} | SPD: ${char.speed}</span>`;
                btn2.onclick = () => selectChar(2, char, btn2);
                p2Container.appendChild(btn2);
            });
        }

        function selectChar(playerNum, char, btnElement) {
            if (playerNum === 1) {
                p1Choice = char;
                document.querySelectorAll('#p1-options .char-btn').forEach(b => b.classList.remove('p1-active'));
                btnElement.classList.add('p1-active');
            } else {
                p2Choice = char;
                document.querySelectorAll('#p2-options .char-btn').forEach(b => b.classList.remove('p2-active'));
                btnElement.classList.add('p2-active');
            }

            if (p1Choice && p2Choice) {
                const startBtn = document.getElementById('start-btn');
                startBtn.disabled = false;
                startBtn.innerText = "START FIGHT!";
            }
        }

        function startGame() {
            document.getElementById('character-select').style.display = 'none';
            gameStarted = true;

            // Initialize fighters with chosen stats
            player = new Fighter({
                position: { x: 200, y: 0 },
                velocity: { x: 0, y: 0 },
                stats: p1Choice,
                facingRight: true
            });

            enemy = new Fighter({
                position: { x: 774, y: 0 },
                velocity: { x: 0, y: 0 },
                stats: p2Choice,
                facingRight: false
            });

            // Reset UI Health bars to visually match character choices
            document.querySelector('#player1-health').style.width = '100%';
            document.querySelector('#player2-health').style.width = '100%';
            document.querySelector('#player1-health').style.backgroundColor = p1Choice.color;
            document.querySelector('#player2-health').style.backgroundColor = p2Choice.color;
            
            resultUI.style.display = 'none';
            timer = 60;
            decreaseTimer();
            animate();
        }

        createSelectScreen();

        // --- Timer and Win Logic ---

        let timer = 60;
        let timerId;
        const resultUI = document.querySelector('#result');

        function determineWinner() {
            clearTimeout(timerId);
            resultUI.style.display = 'block';
            
            // Calculate health percentages so fighters with different max HP can be compared fairly at timeout
            const p1Percent = player.health / player.maxHealth;
            const p2Percent = enemy.health / enemy.maxHealth;
            
            if (p1Percent === p2Percent) {
                resultUI.innerHTML = 'TIE';
                resultUI.style.color = 'white';
            } else if (p1Percent > p2Percent) {
                resultUI.innerHTML = 'PLAYER 1 WINS';
                resultUI.style.color = p1Choice.color;
            } else {
                resultUI.innerHTML = 'PLAYER 2 WINS';
                resultUI.style.color = p2Choice.color;
            }
        }

        function decreaseTimer() {
            if (timer > 0 && gameStarted) {
                timerId = setTimeout(decreaseTimer, 1000);
                timer--;
                document.querySelector('#timer').innerHTML = timer;
            }

            if (timer === 0) {
                determineWinner();
            }
        }

        // --- Collision Detection ---

        function rectangularCollision({ rect1, rect2 }) {
            return (
                rect1.attackBox.position.x + rect1.attackBox.width >= rect2.position.x &&
                rect1.attackBox.position.x <= rect2.position.x + rect2.width &&
                rect1.attackBox.position.y + rect1.attackBox.height >= rect2.position.y &&
                rect1.attackBox.position.y <= rect2.position.y + rect2.height
            );
        }

        // --- Game Loop ---

        function animate() {
            if (!gameStarted) return;
            window.requestAnimationFrame(animate);

            // Clear frame and draw background
            c.fillStyle = '#222'; // Sky
            c.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw floor/stage
            c.fillStyle = '#444';
            c.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Draw grid lines on background for retro feel
            c.strokeStyle = '#333';
            c.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=50) {
                c.beginPath(); c.moveTo(i, 0); c.lineTo(i, canvas.height); c.stroke();
            }
            for(let i=0; i<canvas.height; i+=50) {
                c.beginPath(); c.moveTo(0, i); c.lineTo(canvas.width, i); c.stroke();
            }

            // Update entities
            player.update();
            enemy.update();

            // Stop movement logic if game is over
            if (player.dead || enemy.dead || timer === 0) {
                if(!resultUI.style.display || resultUI.style.display === 'none') {
                    determineWinner();
                }
                return;
            }

            // --- Player 1 Movement & Hit Stun ---
            if (player.hitStun > 0) {
                player.velocity.x = player.knockbackVelocity; // Get pushed back
                player.hitStun--;
            } else {
                player.velocity.x = 0; // Default to not moving laterally
                if (keys.a.pressed && player.lastKey === 'a') {
                    player.velocity.x = -player.speed;
                    player.facingRight = false;
                } else if (keys.d.pressed && player.lastKey === 'd') {
                    player.velocity.x = player.speed;
                    player.facingRight = true;
                }
            }

            // --- Player 2 Movement & Hit Stun ---
            if (enemy.hitStun > 0) {
                enemy.velocity.x = enemy.knockbackVelocity; // Get pushed back
                enemy.hitStun--;
            } else {
                enemy.velocity.x = 0; // Default to not moving laterally
                if (keys.ArrowLeft.pressed && enemy.lastKey === 'ArrowLeft') {
                    enemy.velocity.x = -enemy.speed;
                    enemy.facingRight = false;
                } else if (keys.ArrowRight.pressed && enemy.lastKey === 'ArrowRight') {
                    enemy.velocity.x = enemy.speed;
                    enemy.facingRight = true;
                }
            }

            // Auto-face logic: if standing still and not stunned, players face each other
            if (player.velocity.x === 0 && enemy.velocity.x === 0 && player.hitStun === 0 && enemy.hitStun === 0) {
                 player.facingRight = player.position.x < enemy.position.x;
                 enemy.facingRight = enemy.position.x < player.position.x;
            }

            // --- Collision Checks ---
            
            // Player attacks Enemy
            if (
                rectangularCollision({ rect1: player, rect2: enemy }) &&
                player.isAttacking &&
                !enemy.dead &&
                enemy.hitStun === 0 // Don't hit them again if they are already flying back
            ) {
                player.isAttacking = false; // hit lands only once per attack
                let direction = player.position.x < enemy.position.x ? 1 : -1; // Push right or left
                
                // Deal damage based on player's Attack stat
                enemy.takeDamage(player.attackPower, direction);
                
                // Update Health bar percentage width
                document.querySelector('#player2-health').style.width = Math.max(0, (enemy.health / enemy.maxHealth) * 100) + '%';
            }

            // Enemy attacks Player
            if (
                rectangularCollision({ rect1: enemy, rect2: player }) &&
                enemy.isAttacking &&
                !player.dead &&
                player.hitStun === 0
            ) {
                enemy.isAttacking = false;
                let direction = enemy.position.x < player.position.x ? 1 : -1;
                
                // Deal damage based on enemy's Attack stat
                player.takeDamage(enemy.attackPower, direction);
                
                // Update Health bar percentage width
                document.querySelector('#player1-health').style.width = Math.max(0, (player.health / player.maxHealth) * 100) + '%';
            }
        }

        // --- Event Listeners ---

        window.addEventListener('keydown', (event) => {
            if (!gameStarted || player.dead || enemy.dead || timer === 0) return;

            switch (event.key) {
                // Player 1
                case 'd':
                    keys.d.pressed = true;
                    player.lastKey = 'd';
                    break;
                case 'a':
                    keys.a.pressed = true;
                    player.lastKey = 'a';
                    break;
                case 'w':
                    // Jump only if on ground and not stunned
                    if (player.velocity.y === 0 && player.hitStun === 0) player.velocity.y = -16; 
                    break;
                case ' ':
                    player.attack();
                    break;

                // Player 2
                case 'ArrowRight':
                    keys.ArrowRight.pressed = true;
                    enemy.lastKey = 'ArrowRight';
                    break;
                case 'ArrowLeft':
                    keys.ArrowLeft.pressed = true;
                    enemy.lastKey = 'ArrowLeft';
                    break;
                case 'ArrowUp':
                    if (enemy.velocity.y === 0 && enemy.hitStun === 0) enemy.velocity.y = -16;
                    break;
                case 'Enter':
                case '0':
                    enemy.attack();
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key) {
                // Player 1
                case 'd':
                    keys.d.pressed = false;
                    break;
                case 'a':
                    keys.a.pressed = false;
                    break;

                // Player 2
                case 'ArrowRight':
                    keys.ArrowRight.pressed = false;
                    break;
                case 'ArrowLeft':
                    keys.ArrowLeft.pressed = false;
                    break;
            }
        });
    </script>
</body>
</html>
